# ==============================================================================
# Nginx Reverse Proxy untuk Zhou Consulting Backend
# Lokasi: /etc/nginx/sites-available/zhou_backend.conf
# ==============================================================================

# Rate Limiting Zone di Nginx
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# Server Block Utama: Melayani langsung baik melalui IP maupun Domain
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 139.190.103.80 43.173.2.162 api.zhouconsulting.id zhouconsulting.id dev.zhouconsulting.id api.zhouconsulting.com dev.zhouconsulting.com _;

    # Batas ukuran upload berkas (Maks 6MB sesuai PRD)
    client_max_body_size 6M;

    # Routing seluruh request ke Express.js port 5000
    location / {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
# 2. Server Block untuk Akses Direct IP (139.190.103.80 / 43.173.2.162) -> Direct Proxy ke Express port 5000 (Tanpa Redirect)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 139.190.103.80 43.173.2.162 _;

    client_max_body_size 6M;

    location / {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
