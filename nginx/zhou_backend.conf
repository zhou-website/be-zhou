# ==============================================================================
# Nginx Reverse Proxy & Redirect untuk Zhou Consulting Backend
# Lokasi: /etc/nginx/sites-available/zhou_backend.conf
# ==============================================================================

# Rate Limiting Zone di Nginx
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# 1. Server Block untuk Domain Resmi (api.zhouconsulting.id & zhouconsulting.id)
server {
    listen 80;
    listen [::]:80;
    server_name api.zhouconsulting.id zhouconsulting.id dev.zhouconsulting.id api.zhouconsulting.com dev.zhouconsulting.com;

    # Batas ukuran upload berkas (Maks 6MB sesuai PRD)
    client_max_body_size 6M;

    # Routing seluruh request (termasuk landing page & panduan API di /) ke Express.js port 5000
    location / {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# 2. Server Block untuk Akses Direct IP (139.190.103.80) -> Auto Redirect ke api.zhouconsulting.id
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 139.190.103.80 43.173.2.162 _;

    return 301 http://api.zhouconsulting.id$request_uri;
}
