# ==============================================================================
# Nginx Reverse Proxy untuk Zhou Consulting Backend (HTTP & HTTPS)
# Lokasi: /etc/nginx/sites-available/zhou_backend.conf
# ==============================================================================

# Rate Limiting Zone di Nginx
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# Server Block HTTPS (Port 443) dengan SSL Let's Encrypt
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 139.190.103.80 43.173.2.162 api.zhouconsulting.id zhouconsulting.id dev.zhouconsulting.id api.zhouconsulting.com dev.zhouconsulting.com _;

    ssl_certificate /etc/letsencrypt/live/api.zhouconsulting.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.zhouconsulting.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    location / {
        limit_req zone=api_limit burst=50 nodelay;

        # Header Keamanan & Kompatibilitas Google SSO Popup (COOP)
        # Menjamin browser mengizinkan komunikasi postMessage dari popup Google Identity Services (GSI) ke window opener
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# Server Block HTTP (Port 80): Melayani API proxy langsung & mendukung Next.js server proxy tanpa 301 loop
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 139.190.103.80 43.173.2.162 api.zhouconsulting.id zhouconsulting.id dev.zhouconsulting.id api.zhouconsulting.com dev.zhouconsulting.com _;

    client_max_body_size 20M;

    location / {
        limit_req zone=api_limit burst=50 nodelay;

        # Header Keamanan & Kompatibilitas Google SSO Popup (COOP)
        # Menjamin browser mengizinkan komunikasi postMessage dari popup Google Identity Services (GSI) ke window opener
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
