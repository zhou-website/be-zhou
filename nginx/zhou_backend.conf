# ==============================================================================
# Nginx Reverse Proxy & SSL Termination untuk Zhou Consulting Backend
# Lokasi: /etc/nginx/sites-available/zhou_backend.conf
# ==============================================================================

# Rate Limiting Zone di Nginx
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

server {
    listen 80;
    server_name api.zhouconsulting.com;

    # Redirect seluruh lalu lintas HTTP ke HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.zhouconsulting.com;

    # SSL Certificates (Dikelola otomatis via Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/api.zhouconsulting.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.zhouconsulting.com/privkey.pem;

    # TLS Optimization & Security Headers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Batas ukuran upload berkas (Maks 5MB sesuai PRD)
    client_max_body_size 6M;

    # Routing seluruh request API (/api/*) ke Express.js port 5000
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Dokumentasi Scalar Interactive API Reference
    location /docs {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Favicon untuk menghindari error 404 pada browser
    location /favicon.ico {
        proxy_pass http://127.0.0.1:5000;
    }
}
