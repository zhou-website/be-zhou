version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: zhou_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=zhou_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: zhou_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data: